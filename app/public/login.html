<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FINCA MARIA — Connexion</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8edcf;background:#0a0f0b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 75% 15%,rgba(214,169,85,.16),transparent 34%),linear-gradient(145deg,#111c14,#050806)}main{width:min(460px,100%);border:1px solid rgba(214,169,85,.28);border-radius:24px;padding:28px;background:rgba(10,15,11,.96);box-shadow:0 24px 70px rgba(0,0,0,.35)}small{color:#c5aa73;letter-spacing:.12em}h1{margin:.45rem 0 .6rem;font:700 2.25rem/1 Georgia,serif;color:#fff4d8}p{color:#cdbb91;line-height:1.5}label{display:block;margin-top:16px;color:#e6d3ab;font-size:.88rem;font-weight:700}input{width:100%;margin-top:6px;min-height:48px;border:1px solid rgba(214,169,85,.28);border-radius:12px;padding:10px 12px;background:#101711;color:#fff7e5;font:inherit}button{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:999px;background:#efd99d;color:#172019;font:800 1rem/1 system-ui;cursor:pointer}.msg{min-height:1.5rem;margin-top:12px;color:#e9b6a6;font-size:.88rem}.note{font-size:.78rem;color:#9f916f}
  </style>
</head>
<body>
  <main>
    <small>ACCÈS PRIVÉ</small>
    <h1>FINCA MARIA</h1>
    <p>Connexion nominative au logiciel de gestion de la ferme.</p>
    <form id="loginForm">
      <label>Email<input id="email" name="email" type="email" autocomplete="username" required /></label>
      <label>Mot de passe<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Se connecter</button>
      <div class="msg" id="message" aria-live="polite"></div>
    </form>
    <p class="note">Chaque administrateur utilise son propre compte. Aucun identifiant ne doit être partagé.</p>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
