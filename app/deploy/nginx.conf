# Document previews may be framed only by FINCA MARIA; uploaded scripts never execute.
map $uri $finca_frame_options {
  default DENY;
  /api/baul/preview SAMEORIGIN;
}
map $uri $finca_csp {
  default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  /api/baul/preview "default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";
}

# Cache long uniquement pour les ressources visuelles versionnées.
# Les bundles JavaScript restent en no-store car ils peuvent embarquer des données métier.
map $uri $finca_cache_control {
  default "private, no-store";
  ~*^/(?:family/)?assets/.*\.(css|png|jpe?g|gif|webp|svg|ico|woff2?)$ "private, max-age=31536000, immutable";
}

limit_req_zone $binary_remote_addr zone=finca_login:10m rate=5r/m;

upstream finca_api {
  server finca-api:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 170m;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Keep all add_header directives at this level: location overrides cancel inheritance.
  add_header Cache-Control $finca_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options $finca_frame_options always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy $finca_csp always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location = /login.html {
    try_files /login.html =404;
  }

  location = /login.js {
    try_files /login.js =404;
  }

  location = /api/healthz {
    proxy_pass http://finca_api/api/healthz;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/login {
    limit_except POST { deny all; }
    limit_req zone=finca_login burst=5 nodelay;
    client_max_body_size 32k;
    proxy_pass http://finca_api/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  # Tout compte nominatif actif peut accéder à la vue héritiers.
  location = /_finca_user_check {
    internal;
    proxy_pass http://finca_api/api/auth/check-family;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Le logiciel complet reste réservé aux administrateurs.
  location = /_finca_admin_check {
    internal;
    proxy_pass http://finca_api/api/auth/check-admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API de consultation héritiers : session et données partagées uniquement.
  location = /family-api/me {
    auth_request /_finca_user_check;
    proxy_pass http://finca_api/api/auth/me;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location = /family-api/bootstrap {
    auth_request /_finca_user_check;
    limit_except GET { deny all; }
    proxy_pass http://finca_api/api/family/bootstrap;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location = /family-api/logout {
    auth_request /_finca_user_check;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://finca_api/api/auth/logout;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  # Toutes les autres routes API restent strictement administrateur.
  location /api/ {
    auth_request /_finca_admin_check;
    proxy_pass http://finca_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location @login_redirect {
    return 302 /login.html;
  }

  location @family_login_redirect {
    return 302 /login.html?next=/family/;
  }

  location = /family {
    return 302 /family/;
  }

  # Même logiciel et mêmes données serveur, avec une API limitée à la lecture.
  location /family/ {
    auth_request /_finca_user_check;
    error_page 401 403 = @family_login_redirect;
    try_files $uri $uri/ /family/index.html;
  }

  # La racine historique reste réservée aux administrateurs.
  location / {
    auth_request /_finca_admin_check;
    error_page 401 403 = @login_redirect;
    try_files $uri $uri/ /index.html;
  }
}
